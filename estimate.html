<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Estimating workbook</title>
  <meta name="description" content="Build a residential GC estimate scope by scope: labor, material, equipment, subcontracts, general conditions, markups, and developer pro forma.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect x=%273%27 y=%273%27 width=%2726%27 height=%2726%27 rx=%274%27 fill=%27%231f2933%27/%3E%3Crect x=%277%27 y=%2711%27 width=%2718%27 height=%2710%27 rx=%272%27 fill=%27none%27 stroke=%27%23b8322a%27 stroke-width=%272.5%27/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="estimate.html">
  <header data-header></header>
  <main class="wrap">
    <div class="workbook-head">
      <div>
        <h1 id="est-title">Estimating workbook</h1>
        <p id="est-sub">Scope-by-scope cost build-up. Every number is editable.</p>
      </div>
      <div class="actions no-print">
        <select id="tpl-product" aria-label="Product type for a new estimate"></select>
        <button id="btn-new">Start from template</button>
        <a class="btn" href="templates/estimating-workbook-template.xlsx" download>Blank Excel template</a>
        <button id="btn-xlsx" class="btn-primary">Export to Excel</button>
      </div>
    </div>

    <div class="tabs" role="tablist">
      <button role="tab" data-tab="t-summary">Summary & pricing</button>
      <button role="tab" data-tab="t-scopes">Scopes</button>
      <button role="tab" data-tab="t-labor">Labor rates</button>
      <button role="tab" data-tab="t-gc">General conditions</button>
      <button role="tab" data-tab="t-bids">Bid leveling</button>
      <button role="tab" data-tab="t-data">Data we need from you</button>
    </div>

    <section id="t-summary" class="panel" role="tabpanel"></section>
    <section id="t-scopes" class="panel" role="tabpanel"></section>
    <section id="t-labor" class="panel" role="tabpanel"></section>
    <section id="t-gc" class="panel" role="tabpanel"></section>
    <section id="t-bids" class="panel" role="tabpanel"></section>
    <section id="t-data" class="panel" role="tabpanel"></section>
  </main>
  <footer data-footer></footer>
  <script src="assets/vendor/xlsx-style.bundle.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/templates-data.js"></script>
  <script src="assets/js/data-defaults.js"></script>
  <script src="assets/js/estimate-calc.js"></script>
  <script src="assets/js/estimate.js"></script>
</body>
</html>
